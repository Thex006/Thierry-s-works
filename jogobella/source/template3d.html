<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogobella — Real fruit yogurts</title>
<meta name="description" content="Jogobella drinking yogurts with real fruit pieces. Cherry, Strawberry, Raspberry lime, Peach maracuja, Apricot and Watermelon.">
<style>
@font-face{font-family:Poppins;font-style:normal;font-weight:500;font-display:swap;src:url(@@P500@@) format('woff2')}
@font-face{font-family:Poppins;font-style:normal;font-weight:600;font-display:swap;src:url(@@P600@@) format('woff2')}
@font-face{font-family:Poppins;font-style:normal;font-weight:700;font-display:swap;src:url(@@P700@@) format('woff2')}
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:800;font-display:swap;src:url(@@B800@@) format('woff2')}

:root{
  --u:1px;
  --n:clamp(0.5px, min(calc(100vw / 1440), calc(100vh / 900)), 1.3px);
  --fy:0px;
  --ease:cubic-bezier(0.22, 0.8, 0.3, 1);
  --ui-shadow:0 1px 6px rgba(90,70,40,0.18);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:@@BG0@@;
  touch-action:pan-y;
  font-family:Poppins, system-ui, sans-serif;
  color:#FFFFFF;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

/* ---------- stage + slides ---------- */
.stage{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}
.slide{position:absolute;inset:0;overflow:hidden;visibility:hidden;z-index:0}
.slide.is-current{visibility:visible;z-index:2}
.frame{
  position:absolute;
  width:calc(1440 * var(--u));height:calc(900 * var(--u));
  left:calc(50% - 720 * var(--u));
  top:calc(50% - 450 * var(--u) + var(--fy));
}
.layer{position:absolute;inset:0;will-change:transform}
.word{
  position:absolute;left:0;width:100%;
  text-align:center;font-weight:700;line-height:1;white-space:nowrap;color:#FFFFFF;
  font-kerning:normal;
}
.shadow{
  position:absolute;border-radius:50%;
  background:radial-gradient(closest-side, rgba(60,40,80,0.22), transparent);
  filter:blur(calc(4 * var(--u)));
}
.crop{background-repeat:no-repeat}
.cup{position:absolute}
.cup .crop{width:100%;height:100%}
.pc{position:absolute}
.pc.mirror{transform:scaleX(-1)}
.corner .pc{filter:blur(calc(9 * var(--u)))}
.gl-layer canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.pi{
  width:100%;height:100%;
  transform:rotate(var(--r));
  animation:bob var(--d) ease-in-out var(--dl) infinite alternate;
  will-change:transform;
}
@keyframes bob{
  from{transform:translateY(calc(-7 * var(--u))) rotate(calc(var(--r) - 3deg))}
  to{transform:translateY(calc(7 * var(--u))) rotate(calc(var(--r) + 3deg))}
}

/* ---------- fixed UI ---------- */
.ui{position:fixed;inset:0;z-index:10;pointer-events:none}
.ui a,.ui button{
  pointer-events:auto;background:none;border:0;color:#FFFFFF;font:inherit;
  text-decoration:none;cursor:pointer;padding:0;margin:0;
  -webkit-tap-highlight-color:transparent;
}
.ui a:focus-visible,.ui button:focus-visible{outline:2px solid #FFFFFF;outline-offset:4px;border-radius:4px}
.hdr{
  position:absolute;left:calc(50 * var(--n));right:calc(50 * var(--n));
  top:calc(26 * var(--n));height:calc(50 * var(--n));
  display:flex;align-items:center;
}
.ui .logo{
  font-family:'Baloo 2', Poppins, system-ui, sans-serif;font-weight:800;
  font-size:calc(51 * var(--n));letter-spacing:-0.02em;line-height:1;
  text-shadow:var(--ui-shadow);
}
.tabs{
  position:absolute;left:50%;transform:translateX(-50%);
  display:flex;gap:calc(44 * var(--n));
  font-weight:500;font-size:calc(21 * var(--n));
}
.tabs button{padding:calc(6 * var(--n)) 0;text-shadow:var(--ui-shadow);white-space:nowrap;line-height:1.5}
.ul{
  position:absolute;left:0;top:0;height:2px;border-radius:2px;background:#FFFFFF;width:0;
  box-shadow:var(--ui-shadow);
  transition:transform 0.6s cubic-bezier(0.65, 0, 0.35, 1), width 0.6s cubic-bezier(0.65, 0, 0.35, 1);
  pointer-events:none;
}
.acct{
  margin-left:auto;display:flex;align-items:center;gap:calc(22 * var(--n));
  font-weight:500;font-size:calc(21 * var(--n));
}
.acct a,.acct span{text-shadow:var(--ui-shadow)}
.acct .sep{opacity:0.9}
.ui .shop{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(36 * var(--n));
  font-weight:600;font-size:calc(21 * var(--n));letter-spacing:0.2em;
  padding:calc(10 * var(--n)) calc(16 * var(--n));
  text-shadow:var(--ui-shadow);white-space:nowrap;line-height:1.5;
}
.arrow{
  position:absolute;bottom:calc(30 * var(--n));
  width:calc(52 * var(--n));height:calc(52 * var(--n));
  display:flex;align-items:center;justify-content:center;
}
.arrow.prev{left:calc(36 * var(--n))}
.arrow.next{right:calc(36 * var(--n))}
.arrow svg{width:calc(28 * var(--n));height:calc(28 * var(--n));overflow:visible;filter:drop-shadow(0 1px 4px rgba(90,70,40,0.18))}
.arrow path{fill:none;stroke:#FFFFFF;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* hidden state before the opening sequence */
.is-pre .rise{opacity:0;translate:0 14px}
.is-pre .slide.is-current .frame{opacity:0}

/* ---------- tablet + phone ---------- */
@media (max-width:820px), (orientation:portrait){
  :root{--n:1px}
  .hdr{left:20px;right:20px;top:16px;height:40px}
  .ui .logo{font-size:34px}
  .acct{font-size:15px;gap:10px}
  .tabs{
    top:36px;gap:6px 22px;font-size:15px;
    flex-wrap:wrap;justify-content:center;width:max-content;max-width:min(320px, calc(100vw - 40px));
  }
  .tabs button{padding:6px 0}
  .ui .shop{font-size:15px;bottom:22px}
  .arrow{width:48px;height:48px;bottom:12px}
  .arrow.prev{left:8px}
  .arrow.next{right:8px}
  .arrow svg{width:24px;height:24px}
}
</style>
</head>
<body class="is-pre">
<main class="stage" id="stage" aria-roledescription="carousel" aria-label="Jogobella flavours"></main>

<div class="ui">
  <header class="hdr">
    <a class="logo rise" href="#" data-rise="250">Jogobella</a>
    <nav class="tabs rise" id="tabs" aria-label="Flavours" data-rise="330"><span class="ul" id="ul"></span></nav>
    <div class="acct rise" data-rise="410">
      <a href="#">Cart</a><span class="sep" aria-hidden="true">|</span><a href="#">Register</a>
    </div>
  </header>
  <button class="arrow prev rise" id="prev" type="button" aria-label="Previous flavour" data-rise="490">
    <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M24 14H4 M12 6l-8 8 8 8"/></svg>
  </button>
  <a class="shop rise" href="#" data-rise="570">SHOP NOW</a>
  <button class="arrow next rise" id="next" type="button" aria-label="Next flavour" data-rise="650">
    <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M4 14h20 M16 6l8 8-8 8"/></svg>
  </button>
</div>

<script>window.JB=/*DATA*/;</script>
<script>/*APP*/</script>
</body>
</html>
