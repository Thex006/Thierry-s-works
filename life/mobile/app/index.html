<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Life</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude Life">
<meta name="theme-color" content="#17131f">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hud">
  <h1>Claude Life</h1>
  <div class="hud-row">
    <span id="balance" class="coin">$0.00</span>
    <span id="lives" aria-label="Lives"></span>
    <span id="day" class="muted"></span>
  </div>
</header>

<main id="main" hidden>
  <section class="card now">
    <div class="row"><span id="badge" class="badge">…</span><small id="updated" class="muted"></small></div>
    <p id="nowText" class="big"></p>
    <small id="nowMeta" class="muted"></small>
  </section>
  <section id="needs"></section>
  <section id="review"></section>
  <section id="bets"></section>
  <section id="chat"></section>
  <section id="journal"></section>
  <p class="muted foot">Read-only. Approve, reply or pause from the Claude Life app on the PC.</p>
</main>

<form id="unlock" class="card unlock" hidden>
  <h2>Unlock</h2>
  <p class="muted">Paste the passphrase from <code>life\private\mobile-key.txt</code> on the PC. It stays on this phone only.</p>
  <input id="pass" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" aria-label="Passphrase" required>
  <button type="submit">Unlock</button>
  <p id="unlockErr" class="err" role="alert"></p>
</form>

<button id="lock" class="linkbtn" hidden>Forget passphrase on this phone</button>
<script src="app.js"></script>
</body>
</html>
